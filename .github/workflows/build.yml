name: IINACT build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: '0.0.0.0'
      DALAMUD_HOME: /tmp/dalamud
      DOTNET_NOLOGO: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Download Dalamud (dal4kr)
      shell: pwsh
      run: |
        $manifest = Invoke-RestMethod -Uri https://raw.githubusercontent.com/dal4kr/Dalamud.Resources/refs/heads/main/Dalamud/VersionInfo.json
        Invoke-WebRequest -Uri $manifest.downloadUrl -OutFile Release.zip
        Expand-Archive -Force Release.zip $env:DALAMUD_HOME
        $hash = (Get-FileHash "$env:DALAMUD_HOME/hashes.json" -Algorithm MD5).Hash
        if ($hash -ne $manifest.Hash) {
          throw "Dalamud hashes.json mismatch: manifest $($manifest.Hash), got $hash"
        }
        Write-Output "Dalamud $($manifest.AssemblyVersion) for game $($manifest.SupportedGameVer)"
    - name: Build
      run: dotnet build -c release
    - name: Prepare Build Artifact
      shell: pwsh
      run: |
        Copy-Item "IINACT/bin/Release/win-x64/IINACT/latest.zip" -Destination "IINACT.zip"
        Expand-Archive -Force IINACT.zip Artifact
    - name: Upload IINACT
      uses: actions/upload-artifact@v4
      with:
        name: IINACT
        path: Artifact/*
    - name: Update repo.kr.json if needed
      shell: pwsh
      run: |
        $repo = Get-Content 'repo.kr.json' -raw | ConvertFrom-Json
        $build = Get-Content 'IINACT/bin/Release/win-x64/IINACT/IINACT.json' -raw | ConvertFrom-Json
        if ($repo.AssemblyVersion -eq $build.AssemblyVersion) {
          Exit
        }
        Write-Output "RELEASE_VERSION=$($build.AssemblyVersion)" >> $env:GITHUB_ENV
        $repo.AssemblyVersion = $repo.TestingAssemblyVersion = $build.AssemblyVersion
        $repo.DownloadLinkInstall = 'https://github.com/aetherfl0w/IINACT_KR/releases/download/v' + $repo.AssemblyVersion + '/IINACT.zip'
        $repo.DownloadLinkTesting = $repo.DownloadLinkInstall
        $repo.DownloadLinkUpdate = $repo.DownloadLinkInstall
        $repo | ConvertTo-Json | % { "[`n" + $_ + "`n]" } | Set-Content 'repo.kr.json'
    - name: Create Release
      if: ${{ env.RELEASE_VERSION != '0.0.0.0' }}
      uses: softprops/action-gh-release@v2
      with:
        files: IINACT.zip
        name: IINACT KR ${{ env.RELEASE_VERSION }}
        tag_name: v${{ env.RELEASE_VERSION }}
        prerelease: false
        append_body: true
        body_path: .github/release-notices.kr.md
        generate_release_notes: true
        fail_on_unmatched_files: true
    - name: Commit repo.kr.json
      if: ${{ env.RELEASE_VERSION != '0.0.0.0' }}
      run: |
        git config --global user.name "Actions User"
        git config --global user.email "actions@github.com"
        git fetch origin main
        git checkout main
        git add repo.kr.json
        git commit -m "[CI] updating repo.kr.json for ${{ env.RELEASE_VERSION }}" || true
        git push origin main
