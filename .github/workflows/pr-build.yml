name: IINACT build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud
      DOTNET_NOLOGO: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Download Dalamud (dal4kr)
      shell: pwsh
      run: |
        $manifest = Invoke-RestMethod -Uri https://raw.githubusercontent.com/dal4kr/Dalamud.Resources/refs/heads/main/Dalamud/VersionInfo.json
        Invoke-WebRequest -Uri $manifest.downloadUrl -OutFile Release.zip
        Expand-Archive -Force Release.zip $env:DALAMUD_HOME
        $hash = (Get-FileHash "$env:DALAMUD_HOME/hashes.json" -Algorithm MD5).Hash
        if ($hash -ne $manifest.Hash) {
          throw "Dalamud hashes.json mismatch: manifest $($manifest.Hash), got $hash"
        }
        Write-Output "Dalamud $($manifest.AssemblyVersion) for game $($manifest.SupportedGameVer)"
    - name: Build
      run: dotnet build -c release
    - name: Prepare Build Artifact
      shell: pwsh
      run: |
        Copy-Item "IINACT/bin/Release/win-x64/IINACT/latest.zip" -Destination "IINACT.zip"
        Expand-Archive -Force IINACT.zip Artifact
    - name: Upload IINACT
      uses: actions/upload-artifact@v4
      with:
        name: IINACT
        path: Artifact/*
